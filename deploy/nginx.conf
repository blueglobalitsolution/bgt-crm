# BGT CRM - Nginx reverse proxy (HTTPS termination)
# Place in /etc/nginx/sites-available/bgt-crm and symlink to sites-enabled.
# Assumes your app runs on 127.0.0.1:3000 (managed by pm2).

server {
    listen 80;
    server_name crm.example.com;

    # Force HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm.example.com;

    # ---- TLS certificates (use certbot: certbot --nginx -d crm.example.com) ----
    ssl_certificate     /etc/letsencrypt/live/crm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20m;   # allow larger Excel imports

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;   # audits can run long in the background
    }
}
